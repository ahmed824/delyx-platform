<!DOCTYPE html>
<html lang="en">
    <head>
        <title></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="A modern e-commerce website built with HTML, CSS, and JavaScript">
        <meta name="keywords" content="e-commerce, online store, shopping, HTML, CSS, JavaScript">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/all.min.css">
        
        <style>
            section {
                min-height: 100vh;
                display: flex;
            }
            
        </style>
    </head>

    <body>
        <header>
            <div class="header center">
                <div class="container__header">
                    <div class="logo">
                        <a href="index.html"> <img src="images/Logo__dark.png" alt="" class="logo__header animate-logo" ></a>
                        <a href="index.html"><img src="images/Logo.png" alt="" class="logo__header dar animate-logo" > </a>
                        <a href="index.html"><img src="images/Logo__dark.png" alt="" class="logo__header mobile animate-logo" ></a>
                </div>
               <!-- <div class="dark__mode">
                    <button id="darkToggle"><i class="fa-solid fa-moon"></i></button>

                </div> -->
                
            </div>
            </div>
            
        </header>

        <main>
            <section>
                <div class="container__register">
                    
                    <div class="form register animate-form-register">
                        <form class="form">
                            <div class="hero">
                                
                            </div>
                            <div class="flex-column">
                                <label>Full Name</label>
                                <div class="inputForm">
                                    
                                    <input placeholder="Enter your Full Name" class="input" type="text" autofocus>
                                </div>
                            </div>
                            <div class="flex-column">
                                <label>Email or Phone number </label>
                                <div class="inputForm">
                                    
                                    <input placeholder="Enter Your Email Or Phone Number" class="input" type="text">
                                </div>
                            </div>
                                
                            
                            <div class="flex-column">
                            <label>Password </label>
                                <div class="inputForm">
                                
                                <input placeholder="Enter your Password" class="input password-input" type="password">
                                <i class="fa-solid fa-eye toggle-password"></i>
                            </div>
                        </div>
                            
                            
                            <div class="flex-row">
                                <div>
                                    <input type="radio">
                                    <label>Remember me </label>
                                </div>
                                <!-- <span class="span">Forgot password?</span> -->
                            </div>
                            
                            <button class="button-submit type1">
                                <span class="btn-txt">Create Account</span>
                            </button>
                            <p class="p">Already have an account ? <a href="login.html"><span class="span">sign In</span></a></p>

                        

                        </form>
                    </div>
                    <div class="img__register animate-image-register">
                        <div class="img-wrapper register">
                            <div class="wrapper__text ">
                                <h1>Welcome !</h1>
                                <p>Access secure, real-time autonomous delivery services.</p>
                            </div>
                            
                        </div>
                    </div>
                </div>    
            </section>
        </main>
        
        <script src="js/app.js"></script>

    </body>
</html>
