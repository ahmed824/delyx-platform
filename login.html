<!DOCTYPE html>
<html lang="en">
    <head>
        <title></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="A modern e-commerce website built with HTML, CSS, and JavaScript">
        <meta name="keywords" content="e-commerce, online store, shopping, HTML, CSS, JavaScript">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/all.min.css">
        <style>
            section {
                    min-height: 100vh;
                    display: flex;
                }
        </style>
    </head>

    <body >
        <header>
            <div class="header center">
                <div class="container__header">
                    <div class="logo">
                    <a href="index.html"><img src="images/Logo.png" alt="" class="logo__header  animate-logo" > </a>
                    <img src="images/Logo.png" alt="" class="logo__header dar animate-logo" >
                    <img src="images/Logo__dark.png" alt="" class="logo__header mobile animate-logo" >
                    
                </div>
                </div>
            </div>
            
        </header>
        <main>
            <section>
                <div class="container__login">
                    <div class="img__login">
                        <div class="img-wrapper login animate-image-login">
                            
                            <div class="wrapper__text "">
                                <h1>Hey! Welcome Back</h1>
                                <p>Monitor and manage autonomous deliveries in real time</p>
                            </div>
                        </div>
                    </div>
                    <div class="form login animate-form-login">
                        <form class="form">
                            <div class="flex-column">
                                <label>Email or Phone number </label>
                                <div class="inputForm">
                                    
                                    <input placeholder="Enter your Email Or Phone Number" class="input" type="text" >
                                </div>
                            </div>
                                
                            
                            <div class="flex-column">
                            <label>Password </label>
                                <div class="inputForm">
                                
                                <input placeholder="Enter your Password" class="input" type="password">
                                <i class="fa-solid fa-eye"></i>
                            </div>
                        </div>
                            
                            
                            <div class="flex-row">
                                <div>
                                    <input type="radio">
                                    <label>Remember me </label>
                                </div>
                                <span class="span">Forgot password?</span>
                            </div>
                            
                            <button class="button-submit type1">
                                <span class="btn-txt">Log In</span>
                            </button>
                            <p class="p">New to DELY X ?<a href="register.html"><span class="span">Create Account</span></a></p>

                        

                        </form>
                    </div>
                </div>
            </section>
        </main>
        
        <script src="js/app.js"></script>
    </body>
</html>
